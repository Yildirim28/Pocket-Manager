<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA -->
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PocketMgr" />
    <title>Create account — Pocket Manager</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/config.js?v=15" defer></script>
    <script src="js/site.js?v=15" defer></script>
    <script src="js/auth.js?v=15" defer></script>
</head>
<body class="min-h-full bg-slate-50 font-sans text-slate-800 antialiased selection:bg-indigo-100 selection:text-indigo-900" data-page="signup">

    <div id="navbar"></div>

    <main class="relative mx-auto flex max-w-md flex-col px-4 py-16">
        <div aria-hidden="true" class="pointer-events-none absolute -top-24 left-1/2 -z-10 h-72 w-[600px] -translate-x-1/2 rounded-full bg-gradient-to-tr from-indigo-200/50 via-violet-200/40 to-sky-200/50 blur-3xl"></div>
        <div class="rounded-2xl border border-slate-200/80 bg-white p-8 shadow-xl shadow-slate-200/50">
            <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-600/30">
                <i data-lucide="user-plus" class="h-7 w-7"></i>
            </span>
            <h1 class="mt-5 text-center text-2xl font-bold tracking-tight text-slate-900">Create your account</h1>
            <p class="mt-2 text-center text-sm text-slate-500">Free forever. Your expenses stay private to your account.</p>

            <form id="authForm" class="mt-8 space-y-5" novalidate>
                <div>
                    <label for="email" class="mb-1.5 block text-sm font-medium text-slate-700">Email</label>
                    <div class="relative">
                        <i data-lucide="mail" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
                        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"
                            class="w-full rounded-xl border border-slate-300 bg-white py-2.5 pl-10 pr-3 text-sm placeholder-slate-400 transition-colors focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
                    </div>
                </div>

                <div>
                    <label for="password" class="mb-1.5 block text-sm font-medium text-slate-700">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
                        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="6" placeholder="At least 6 characters"
                            class="w-full rounded-xl border border-slate-300 bg-white py-2.5 pl-10 pr-3 text-sm placeholder-slate-400 transition-colors focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
                    </div>
                </div>

                <div>
                    <label for="confirmPassword" class="mb-1.5 block text-sm font-medium text-slate-700">Confirm password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
                        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required placeholder="Repeat your password"
                            class="w-full rounded-xl border border-slate-300 bg-white py-2.5 pl-10 pr-3 text-sm placeholder-slate-400 transition-colors focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
                    </div>
                </div>

                <p id="authError" class="hidden items-center gap-2 rounded-xl bg-red-50 px-3 py-2.5 text-sm text-red-700" role="alert"></p>
                <p id="authNotice" class="hidden items-center gap-2 rounded-xl bg-indigo-50 px-3 py-2.5 text-sm text-indigo-700" role="status"></p>

                <button id="authSubmit" type="submit"
                    class="w-full rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-600/25 transition-all hover:brightness-110 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-60">
                    <span id="authSubmitText">Create account</span>
                </button>
            </form>

            <p class="mt-6 text-center text-sm text-slate-500">
                Already have an account?
                <a href="login.html" class="font-semibold text-indigo-600 hover:text-indigo-700">Sign in</a>
            </p>
        </div>

        <p class="mt-6 text-center text-xs text-slate-400">
            <a href="index.html" class="hover:text-slate-600">&larr; Back to home</a>
        </p>
    </main>

    <footer class="border-t border-slate-200/80 bg-white">
        <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-3 px-4 py-5 text-xs text-slate-400 sm:flex-row">
            <p>&copy; <span id="footerYear"></span> Pocket Manager. Made with 💜 for people who budget.</p>
            <div class="flex items-center gap-4">
                <a href="mailto:shamimosman344@gmail.com" class="font-medium text-slate-500 transition-colors hover:text-indigo-600">✉️ Email</a>
                <a href="https://wa.me/8801639815290" target="_blank" rel="noopener" class="font-medium text-slate-500 transition-colors hover:text-emerald-600">💬 WhatsApp</a>
            </div>
        </div>
    </footer>
</body>
</html>
