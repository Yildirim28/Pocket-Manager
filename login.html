<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — Pocket Manager</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="js/config.js" defer></script>
    <script src="js/site.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>
<body class="min-h-full bg-slate-50 font-sans text-slate-800 antialiased" data-page="login">

    <div id="navbar"></div>

    <main class="mx-auto flex max-w-md flex-col px-4 py-16">
        <div class="rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
            <h1 class="text-2xl font-bold text-slate-900">Welcome back</h1>
            <p class="mt-2 text-sm text-slate-500">Sign in to your Pocket Manager account.</p>

            <form id="authForm" class="mt-8 space-y-5" novalidate>
                <div>
                    <label for="email" class="mb-1 block text-sm font-medium text-slate-700">Email</label>
                    <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"
                        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm placeholder-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
                </div>

                <div>
                    <label for="password" class="mb-1 block text-sm font-medium text-slate-700">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"
                        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm placeholder-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
                </div>

                <p id="authError" class="hidden rounded-lg bg-red-50 px-3 py-2.5 text-sm text-red-700" role="alert"></p>
                <p id="authNotice" class="hidden rounded-lg bg-indigo-50 px-3 py-2.5 text-sm text-indigo-700" role="status"></p>

                <button id="authSubmit" type="submit"
                    class="w-full rounded-lg bg-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60">
                    <span id="authSubmitText">Sign in</span>
                </button>
            </form>

            <p class="mt-6 text-center text-sm text-slate-500">
                No account yet?
                <a href="signup.html" class="font-semibold text-indigo-600 hover:text-indigo-700">Sign up free</a>
            </p>
        </div>

        <p class="mt-6 text-center text-xs text-slate-400">
            <a href="index.html" class="hover:text-slate-600">&larr; Back to home</a>
        </p>
    </main>
</body>
</html>
