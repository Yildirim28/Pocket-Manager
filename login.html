<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA -->
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PocketMgr" />
    <title>Sign in — Pocket Manager</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        (function () {
            if (localStorage.getItem('pocket-manager:theme') === 'dark') {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
                }
            }
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer onerror="var f=document.createElement('script');f.src='https://unpkg.com/@supabase/supabase-js@2';f.defer=true;document.head.appendChild(f);"></script>
    <script src="js/config.js?v=25" defer></script>
    <script src="js/site.js?v=25" defer></script>
    <script src="js/auth.js?v=25" defer></script>
</head>
<body class="min-h-full pt-16 bg-slate-50 dark:bg-slate-950 font-sans text-slate-800 dark:text-slate-100 antialiased selection:bg-indigo-100 selection:text-indigo-900" data-page="login">

    <div id="navbar"></div>

    <main class="relative mx-auto flex max-w-md flex-col px-4 py-16">
        <div aria-hidden="true" class="pointer-events-none absolute -top-24 left-1/2 -z-10 h-72 w-[600px] -translate-x-1/2 rounded-full bg-gradient-to-tr from-indigo-200/50 via-violet-200/40 to-sky-200/50 blur-3xl"></div>
        <div class="rounded-2xl border border-slate-200/80 dark:border-slate-700/60 bg-white dark:bg-slate-900 p-8 shadow-xl shadow-slate-200/50">
            <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br from-indigo-600 to-violet-600 text-white shadow-lg shadow-indigo-600/30">
                <i data-lucide="log-in" class="h-7 w-7"></i>
            </span>
            <h1 class="mt-5 text-center text-2xl font-bold tracking-tight text-slate-900 dark:text-slate-100">Welcome back</h1>
            <p class="mt-2 text-center text-sm text-slate-500 dark:text-slate-400">Sign in to your Pocket Manager account.</p>

            <form id="authForm" class="mt-8 space-y-5" novalidate>
                <div>
                    <label for="email" class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">Email</label>
                    <div class="relative">
                        <i data-lucide="mail" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 dark:text-slate-500"></i>
                        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"
                            class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 py-2.5 pl-10 pr-3 text-sm placeholder-slate-400 dark:placeholder-slate-500 transition-colors focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
                    </div>
                </div>

                <div>
                    <label for="password" class="mb-1.5 block text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400 dark:text-slate-500"></i>
                        <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"
                            class="w-full rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 py-2.5 pl-10 pr-3 text-sm placeholder-slate-400 dark:placeholder-slate-500 transition-colors focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200" />
                    </div>
                </div>

                <p id="authError" class="hidden items-center gap-2 rounded-xl bg-red-50 px-3 py-2.5 text-sm text-red-700" role="alert"></p>
                <p id="authNotice" class="hidden items-center gap-2 rounded-xl bg-indigo-50 px-3 py-2.5 text-sm text-indigo-700" role="status"></p>

                <button id="authSubmit" type="submit"
                    class="w-full rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-indigo-600/25 transition-all hover:brightness-110 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-60">
                    <span id="authSubmitText">Sign in</span>
                </button>

                <div class="flex items-center gap-3">
                    <span class="h-px flex-1 bg-slate-200 dark:bg-slate-700"></span>
                    <span class="text-xs font-medium text-slate-400 dark:text-slate-500">or continue with</span>
                    <span class="h-px flex-1 bg-slate-200 dark:bg-slate-700"></span>
                </div>

                <button id="googleButton" type="button"
                    class="inline-flex w-full items-center justify-center gap-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 px-4 py-3 text-sm font-semibold text-slate-700 dark:text-slate-300 shadow-sm transition-all hover:border-slate-400 dark:hover:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-900 active:scale-[0.98] disabled:cursor-not-allowed disabled:opacity-60">
                    <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18A10.94 10.94 0 0 0 1 12c0 1.77.43 3.45 1.18 4.94l3.66-2.84z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span id="googleButtonText">Continue with Google</span>
                </button>

                <p class="text-center text-xs text-slate-400 dark:text-slate-500">
                    <a href="#" id="forgotPasswordLink" class="font-medium text-indigo-600 transition-colors hover:text-indigo-700">Forgot your password?</a>
                </p>
            </form>

            <p class="mt-6 text-center text-sm text-slate-500 dark:text-slate-400">
                No account yet?
                <a href="signup.html" class="font-semibold text-indigo-600 hover:text-indigo-700">Sign up free</a>
            </p>
        </div>

        <p class="mt-6 text-center text-xs text-slate-400 dark:text-slate-500">
            <a href="index.html" class="hover:text-slate-600 dark:hover:text-slate-300">&larr; Back to home</a>
        </p>
    </main>

    <footer class="border-t border-slate-200/80 dark:border-slate-700/60 bg-white dark:bg-slate-900">
        <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-3 px-4 py-5 text-xs text-slate-400 dark:text-slate-500 sm:flex-row">
            <p>&copy; <span id="footerYear"></span> Pocket Manager. Made with 💜 for people who budget.</p>
            <div class="flex items-center gap-4">
                <a href="mailto:shamimosman344@gmail.com" class="font-medium text-slate-500 dark:text-slate-400 transition-colors hover:text-indigo-600">✉️ Email</a>
                <a href="https://wa.me/8801639815290" target="_blank" rel="noopener" class="font-medium text-slate-500 dark:text-slate-400 transition-colors hover:text-emerald-600">💬 WhatsApp</a>
            </div>
        </div>
    </footer>
</body>
</html>
